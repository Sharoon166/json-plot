[project]
name = "json-plot"
version = "0.1.0"
description = "Plot JSON annotations over drawing PDFs and train a human-in-the-loop visual annotation model."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pdfplumber>=0.11.10",
    "pillow>=13.0.0",
    "pyside6>=6.10.1",
    "seaborn>=0.13.2",
    "torch==2.10.0+cpu",
    "torchvision==0.25.0+cpu",
    "ultralytics>=8.4.213",
]

[project.scripts]
json-plot = "json_plot:main"
json-plot-model = "json_plot.visual_model:main"
json-plot-gui = "json_plot.gui:main"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
